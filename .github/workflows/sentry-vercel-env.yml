name: Configure Sentry on Vercel

# One-time: add VERCEL_TOKEN and SENTRY_AUTH_TOKEN in GitHub repo secrets,
# then run this workflow manually from the Actions tab.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/setup-sentry-vercel.mjs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
