# GitHub Pages deploy is DISABLED — canonical production is Vercel (gofoundry-seven.vercel.app).
#
# The static export build (GITHUB_PAGES=true) cannot serve API routes, auth, or
# dynamic diagnostics. Running it produced a broken gh-pages branch that broke
# deep links for crawlers. Re-enable only if you need a static mirror with basePath.
#
# To deploy manually: workflow_dispatch with GITHUB_PAGES=true after fixing export.

name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use Vercel for production deploys. See docs/DEPLOYMENT.md."
